<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- stops watchOS shrinking the page to a phone-sized layout -->
<meta name="disabled-adaptations" content="watch">
<title>Toula Watch</title>
<style>
  :root{
    --bg:#000;
    --panel:#1C1C1E;
    --ink:#FFFFFF;
    --muted:#C9C3B5;
    --pine:#4F7A5A;
    --amber:#C2831F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, system-ui, sans-serif;
    font-size:18px; line-height:1.3; font-weight:600;
    -webkit-tap-highlight-color:transparent;
  }
  #app{padding:6px 4px 12px;}
  [hidden]{display:none !important;}
  h1{font-size:19px; margin:0 0 6px; color:var(--amber);}
  .label{font-size:14px; color:var(--muted); margin:10px 2px 4px; text-transform:uppercase; letter-spacing:0.04em;}
  .toggle{
    display:block; width:100%; margin:0 0 4px; padding:8px 10px;
    border:0; border-radius:12px; background:var(--panel); color:var(--muted);
    font:inherit; text-align:left;
  }
  .toggle.on{color:#fff;}
  .toggle .n{float:right; opacity:0.7;}
  .big{
    display:block; width:100%; margin-top:4px; padding:12px;
    border:0; border-radius:20px; background:var(--pine); color:#fff;
    font:inherit; font-weight:700;
  }
  .big:disabled{opacity:0.35;}
  .msg{color:var(--muted); font-size:15px; text-align:center; margin-top:4px;}

  /* card */
  .card{border-radius:14px; background:var(--panel); padding:10px; min-height:120px;}
  .badge{display:inline-block; font-size:13px; padding:2px 7px; border-radius:8px; color:#fff; margin-bottom:6px;}
  .name{font-size:23px; font-weight:800; line-height:1.15;}
  .cue{font-size:18px; color:var(--amber); margin-top:6px;}
  .hint{font-size:13px; color:var(--muted); margin-top:10px;}
  .goal{font-size:17px; margin:0 0 8px;}
  .goal b{color:var(--amber);}
  ol{margin:0; padding-left:18px;}
  li{margin-bottom:6px; font-size:17px;}
  .nav{display:flex; gap:6px; margin-top:8px;}
  .nav button{
    flex:1; padding:10px 0; border:0; border-radius:18px;
    background:var(--panel); color:var(--ink); font:inherit; font-weight:700;
  }
  .nav button.next{background:var(--pine); color:#fff;}
  .nav button:disabled{opacity:0.35;}
</style>
</head>
<body>
<div id="app">

  <div id="screen-filter">
    <h1>Toula Tricks</h1>
    <button class="big" id="startBtn" disabled>Start</button>
    <div class="msg" id="msg">Loading…</div>
    <div class="label">Category</div>
    <div id="cats"></div>
    <div class="label">Level</div>
    <div id="levels"></div>
  </div>

  <div id="screen-card" hidden>
    <div class="card" id="card">
      <div id="front">
        <span class="badge" id="badge"></span>
        <div class="name" id="name"></div>
        <div class="cue" id="cue"></div>
        <div class="hint">Tap for steps</div>
      </div>
      <div id="back" hidden>
        <p class="goal" id="goal"></p>
        <ol id="steps"></ol>
      </div>
    </div>
    <div class="nav">
      <button id="prevBtn">◀</button>
      <button id="menuBtn">☰</button>
      <button class="next" id="nextBtn">▶</button>
    </div>
  </div>

</div>
<script>
/* Deck data lives in index.html (BUILTIN_TRICKS, one JSON object per line).
   Fetch it from there so the watch page never needs its own copy. */
const CATEGORY_COLORS = {
  "Foundations & Core Cues": "#33513C",
  "Life Skills & Manners": "#3E6E72",
  "Cooperative Care & Handling": "#8C5B6E",
  "Games & Enrichment": "#9A6B3C",
  "Tricks": "#C25B3A"
};
const LEVELS = ['Beginner','Intermediate','Advanced'];
const FILTER_KEY = 'toula-watch-filters';

let tricks = [];
let selCats = new Set();
let selLevels = new Set(LEVELS);
let deck = [];
let pos = 0;

const $ = id => document.getElementById(id);

// watchOS can lay a page out at phone width and shrink it to fit, which makes
// text tiny. If the layout is much wider than a watch-sized screen, zoom back up.
if(screen.width && screen.width < 260 && innerWidth > screen.width * 1.2){
  $('app').style.zoom = innerWidth / screen.width;
}

async function loadTricks(){
  const html = await (await fetch('index.html', {cache: 'no-cache'})).text();
  const start = html.indexOf('const BUILTIN_TRICKS = [');
  const end = html.indexOf('\n];', start);
  if(start < 0 || end < 0) throw new Error('deck not found');
  return JSON.parse(html.slice(html.indexOf('[', start), end + 2));
}

function categories(){ return Array.from(new Set(tricks.map(t => t.category))); }
function visible(){ return tricks.filter(t => selCats.has(t.category) && selLevels.has(t.level)); }

function loadFilters(){
  try{
    const saved = JSON.parse(localStorage.getItem(FILTER_KEY));
    if(saved){
      selCats = new Set(saved.cats.filter(c => categories().includes(c)));
      selLevels = new Set(saved.levels.filter(l => LEVELS.includes(l)));
    }
  }catch(e){}
  if(selCats.size === 0) categories().forEach(c => selCats.add(c));
  if(selLevels.size === 0) LEVELS.forEach(l => selLevels.add(l));
}
function saveFilters(){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify({cats: [...selCats], levels: [...selLevels]})); }catch(e){}
}

function toggleList(el, items, set, colorOf, countOf){
  el.innerHTML = '';
  items.forEach(item => {
    const b = document.createElement('button');
    const on = set.has(item);
    b.className = 'toggle' + (on ? ' on' : '');
    b.style.background = on ? colorOf(item) : '';
    b.textContent = item;
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = countOf(item);
    b.appendChild(n);
    b.onclick = () => { if(on) set.delete(item); else set.add(item); saveFilters(); renderFilters(); };
    el.appendChild(b);
  });
}

function renderFilters(){
  toggleList($('cats'), categories(), selCats, c => CATEGORY_COLORS[c] || '#4F7A5A',
    c => tricks.filter(t => t.category === c && selLevels.has(t.level)).length);
  toggleList($('levels'), LEVELS, selLevels, () => '#4F7A5A',
    l => tricks.filter(t => t.level === l && selCats.has(t.category)).length);
  const n = visible().length;
  $('startBtn').disabled = n === 0;
  $('msg').textContent = n ? `${n} cards` : 'Pick a category and level';
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showFront(front){
  $('front').hidden = !front;
  $('back').hidden = front;
}

function renderCard(){
  const t = deck[pos];
  $('badge').textContent = t.category;
  $('badge').style.background = CATEGORY_COLORS[t.category] || '#4F7A5A';
  $('name').textContent = t.name;
  $('cue').textContent = t.cue ? `“${t.cue}”` : '';
  $('goal').innerHTML = t.goal ? '<b>Goal:</b> ' : '';
  $('goal').append(t.goal || '');
  $('goal').hidden = !t.goal;
  $('steps').innerHTML = '';
  t.steps.forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    $('steps').appendChild(li);
  });
  $('prevBtn').disabled = pos === 0;
  showFront(true);
  window.scrollTo(0, 0);
}

$('startBtn').onclick = () => {
  deck = shuffle(visible());
  if(!deck.length) return;
  pos = 0;
  $('screen-filter').hidden = true;
  $('screen-card').hidden = false;
  renderCard();
};
$('card').onclick = () => { showFront($('front').hidden); window.scrollTo(0, 0); };
$('prevBtn').onclick = () => { if(pos > 0){ pos--; renderCard(); } };
$('nextBtn').onclick = () => {
  pos++;
  if(pos >= deck.length){ deck = shuffle(deck); pos = 0; }
  renderCard();
};
$('menuBtn').onclick = () => {
  $('screen-card').hidden = true;
  $('screen-filter').hidden = false;
  renderFilters();
  window.scrollTo(0, 0);
};

loadTricks().then(data => {
  tricks = data;
  loadFilters();
  renderFilters();
}).catch(() => {
  $('msg').textContent = 'Could not load cards. Check your connection.';
});
</script>
</body>
</html>
